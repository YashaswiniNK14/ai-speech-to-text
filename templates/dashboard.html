
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcription History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <h1>Transcription History</h1>
        <a href="/">Back to Speech-to-Text</a>
    </header>

    <main class="container">
        <section class="card">
            <h2>Your Saved Transcriptions</h2>
                <p class="subtitle">View, search, edit, and delete your saved speech records.</p>
                    <label for="searchInput">Search Transcriptions</label>
                         <input type="search" id="searchInput"  placeholder="Search by title or transcription text...">

                <p id="dashboardMessage" role="status"></p>
                    <div id="transcriptionList">
                      <p>Loading transcriptions...</p>
                    </div>

        </section>
    </main>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
